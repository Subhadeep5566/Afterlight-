      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#08090b" />
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
